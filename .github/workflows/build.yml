name: Build

on:
  push:
    branches: [ master, '*-ci' ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Apt update # with workaround for 'Unable to connect to ppa.launchpad.net' failure
        run: sudo apt-get update --option Acquire::Retries=100 --option Acquire::http::Timeout="300"

      - name: Install dependencies
        run: sudo apt-get install python3

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pyinstaller
        run: |
          python3 -m venv python3 venv
          . venv/bin/activate
          pip install -r requirements.txt
          pyinstaller upasku.spec

      - name: Release
        uses: actions/upload-artifact@v4
        with:
          name: upasku-linux64
          path: dist/upasku

  win:
    runs-on: windows-latest
    steps:
    - name: Set up Python 3
      uses: actions/setup-python@v4
      with:
        python-version: 3

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install virtualenv

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Activate venv
      shell: bash
      run: |
        python3 -m virtualenv -p python3 venv
        . venv/Scripts/activate
        pip install -r requirements.txt
        pyinstaller upasku.spec

    - name: Release
      uses: actions/upload-artifact@v4
      with:
        name: upasku-win64
        path: dist/upasku.exe
